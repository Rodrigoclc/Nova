name: Feature request
description: Propose a concrete capability or improvement for Nova.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. For broad architectural exploration, prefer a Discussion before opening an implementation request.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer problem or limitation should Nova solve?
      placeholder: Describe the problem before describing the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?

  - type: textarea
    id: developer-experience
    attributes:
      label: Developer experience
      description: If relevant, show what consuming this feature should look like from application code.
      render: typescript

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
