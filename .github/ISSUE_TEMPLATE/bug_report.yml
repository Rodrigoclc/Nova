name: Bug report
description: Report reproducible behavior that appears to be incorrect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Nova is experimental, so please include enough context for the behavior to be reproduced.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
      placeholder: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest code sample or repository that reproduces the issue.
      render: typescript
    validations:
      required: true

  - type: input
    id: nova-version
    attributes:
      label: Nova version
      placeholder: e.g. 0.1.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Bun
        - Not runtime-specific
        - Other
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: e.g. Node.js 22.x or Bun 1.x

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add logs, stack traces, or other useful information.
