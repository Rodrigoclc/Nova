name: Validate Node.js adapter

on:
  push:
    branches:
      - node-http-adapter

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test Node.js adapter
        run: npm run test:node

      - name: Check formatting
        run: npm run format:check

# Temporary validation workflow: remove before opening the pull request.
